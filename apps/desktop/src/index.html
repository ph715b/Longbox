<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The renderer loads no remote resources. Page images arrive over the
      longbox: protocol and blob: is used for canvas-generated thumbnails.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' longbox: blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Longbox</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
